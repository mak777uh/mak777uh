<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Скачущий табун лошадей">
  <title>Скачущий табун лошадей (тёмная тема)</title>
  <style>
    /* тёмная тема: рисунок не меняется, инверсия — эффект рендера */
    use { filter: invert(1); }
    .run  { animation: run 11.0s linear infinite; }
    /* первые две лошади на 25% быстрее: период /1.25, задержки тем же множителем,
       чтобы стартовая расстановка табуна не изменилась */
    .rA   { animation-duration: 8.8s; animation-delay: -2.176s; }
    .rB   { animation-duration: 8.8s; animation-delay: -1.0s; }
    .rC   { animation-delay: 0s; }
    .bob  { transform-box: fill-box; transform-origin: 50% 100%;
            animation: bob 0.6s cubic-bezier(.33,0,.67,1) infinite; }
    .rA .bob, .rB .bob { animation-duration: 0.48s; }
    .bB   { animation-delay: -0.168s; }
    .bC   { animation-delay: -.42s; }
    .stride { animation: stride 0.6s steps(12) infinite; }
    .rA .stride, .rB .stride { animation-duration: 0.48s; }
    .sB   { animation-delay: -0.168s; }
    .sC   { animation-delay: -.42s; }
    .dust { fill: #cfcfcf; animation: dust 0.6s linear infinite; }
    .rA .dust, .rB .dust { animation-duration: 0.48s; }
    .dB   { animation-delay: -0.168s; }
    .dC   { animation-delay: -.42s; }
    @keyframes run {
      from { transform: translateX(-278px); }
      to   { transform: translateX(1260px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0)     rotate(2deg)  scale(1.06,.94); }
      35%      { transform: translateY(-22px) rotate(-6deg) scale(.97,1.05); }
      70%      { transform: translateY(-4px)  rotate(-1deg) scale(1,1); }
    }
    @keyframes stride {
      from { transform: translateX(0); }
      to   { transform: translateX(-2616px); }
    }
    @keyframes dust {
      0%   { opacity: 0;   transform: translate(0,0) scale(.5); }
      15%  { opacity: .30; }
      100% { opacity: 0;   transform: translate(-26px,-10px) scale(1.6); }
    }
  </style>
  <defs>
    <image id="imFull" href="data:image/png;base64," x="0" y="60" width="218" height="240"/>
  </defs>
  <g class="run rA"><g transform="translate(0,0) scale(1)">
    <g class="dust "><circle cx="26" cy="296" r="6"/><circle cx="9" cy="288" r="4"/></g>
    <g class="bob "><use href="#imFull"/></g>
  </g></g>
  <g class="run rB"><g transform="translate(0,54) scale(0.82)">
    <g class="dust dB"><circle cx="26" cy="296" r="6"/><circle cx="9" cy="288" r="4"/></g>
    <g class="bob bB"><use href="#imFull"/></g>
  </g></g>
  <g class="run rC"><g transform="translate(0,96) scale(0.68)">
    <g class="dust dC"><circle cx="26" cy="296" r="6"/><circle cx="9" cy="288" r="4"/></g>
    <g class="bob bC"><use href="#imFull"/></g>
  </g></g>
</svg>
